name: Render dashboard

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 min, off the busy :00/:30 marks (GitHub may still run late)
  workflow_dispatch:          # "Run workflow" button for manual refreshes

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write              # used by the keep-alive step below

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Last good forecast, reused if both weather services are down.
      - uses: actions/cache@v4
        with:
          path: wx-cache.json
          key: wx-${{ github.run_id }}
          restore-keys: wx-

      - name: Render
        env:
          CAL_ICS_URLS: ${{ secrets.CAL_ICS_URLS }}
          LAT: ${{ vars.LAT }}
          LON: ${{ vars.LON }}
          OUT: site/${{ secrets.DASH_NAME }}.png
        run: |
          python render.py
          echo "ok" > site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # The deploy sometimes can't see the artifact it was just handed (a GitHub
      # hiccup); wait and try once more before failing the run.
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - if: steps.deploy.outcome == 'failure'
        run: sleep 30

      - if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

      # GitHub pauses scheduled workflows after 60 days without repo activity.
      # Re-enabling the workflow through the API keeps the schedule alive.
      - name: Keep schedule alive
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/render.yml/enable" || true
